<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operación al Día · Banca y seguros · AlquimiaEdu</title>
<meta name="description" content="Podcast de AlquimiaEdu sobre operación, fraude, cumplimiento y siniestros en banca y seguros.">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#14232b;--mut:#5b6b73;--line:#dcd6c8;--brand:#0e7c86;--acc:#e0a526}
@media(prefers-color-scheme:dark){:root{--bg:#10191e;--card:#17252c;--ink:#eef2f3;--mut:#9db0b8;--line:#2a3d46}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 120px}
.hero{background:linear-gradient(135deg,#0b4f57,#0e7c86 60%,#12939e);color:#fff;border-radius:20px;padding:28px;margin-bottom:20px}
.brand{font-weight:800;letter-spacing:.04em;font-size:14px;color:var(--acc);text-transform:uppercase}
.hero h1{margin:.3em 0 .2em;font-size:clamp(26px,5vw,38px);line-height:1.15}.hero p{margin:.3em 0;opacity:.92}
.tag{display:inline-block;margin-top:10px;background:var(--acc);color:#14232b;font-weight:700;border-radius:99px;padding:3px 12px;font-size:13px}
.cast{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.who{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.14);border-radius:12px;padding:6px 12px 6px 6px;font-size:13px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.chap{margin:22px 0 8px;font-weight:800;font-size:18px}
.line{display:flex;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.line:hover{background:var(--card)}.line.on{background:var(--card);border-color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.line b{display:block;font-size:13px}.line span{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.play{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700;min-width:96px}
.now{flex:1;min-width:0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;background:var(--line);border-radius:4px;margin-bottom:8px;max-width:860px;margin-inline:auto}.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:4px}
.msg{background:#fff3d6;color:#5a4300;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">AlquimiaEdu · Podcast</div>
    <h1 id="t"></h1><p id="l"></p>
    <span class="tag" id="tag"></span>
    <div class="cast" id="cast"></div>
  </header>
  <div class="msg" id="msg" hidden>Aún no hay audio generado. En GitHub ve a Actions → «Generar voz del podcast» → Run workflow.</div>
  <main id="list"></main>
</div>
<div class="bar"><div class="prog"><i id="pb"></i></div><div class="in">
  <button id="prev" aria-label="Anterior">⏮</button><button class="play" id="play">▶ Escuchar</button><button id="next" aria-label="Siguiente">⏭</button>
  <button id="spd">1×</button><div class="now" id="now">Toca una frase para empezar</div></div></div>
<script src="content.js"></script>
<script>
const P=PODCAST,$=s=>document.querySelector(s);
const hash=s=>{s=s.trim();let h=5381;for(const c of s)h=(((h<<5)+h)+c.codePointAt(0))>>>0;return h.toString(16)};
const all=[];let i=0,playing=false,rate=1;const a=new Audio();a.preload="auto";
$("#t").textContent=P.title;$("#l").textContent=P.lead;$("#tag").textContent=P.show+" · "+P.sector;
const ini=n=>n.split(" ").map(x=>x[0]).join("");
Object.values(P.speakers).forEach(s=>{$("#cast").insertAdjacentHTML("beforeend",`<div class="who"><div class="av" style="background:${s.color}">${ini(s.name)}</div><div><b>${s.name}</b><br>${s.role}</div></div>`)});
P.chapters.forEach(c=>{const h=document.createElement("div");h.className="chap";h.textContent=c.title;$("#list").append(h);
 c.lines.forEach(([sp,tx])=>{const k=all.length,s=P.speakers[sp],d=document.createElement("div");d.className="line";
  d.innerHTML=`<div class="av" style="background:${s.color}">${ini(s.name)}</div><div><b style="color:${s.color}">${s.name}</b><span>${tx}</span></div>`;
  d.onclick=()=>{go(k,true)};$("#list").append(d);all.push({sp,tx,el:d,src:"audio/"+hash(tx)+".mp3"})})});
function go(k,start){i=Math.max(0,Math.min(all.length-1,k));const it=all[i];
 document.querySelectorAll(".line.on").forEach(e=>e.classList.remove("on"));it.el.classList.add("on");
 it.el.scrollIntoView({block:"center",behavior:"smooth"});$("#now").textContent=P.speakers[it.sp].name+" · "+it.tx;
 $("#pb").style.width=(i/all.length*100)+"%";a.src=it.src;a.playbackRate=rate;
 if(start||playing){playing=true;a.play().catch(()=>{$("#msg").hidden=false});$("#play").textContent="⏸ Pausa"}}
a.onended=()=>{i<all.length-1?go(i+1):(playing=false,$("#play").textContent="▶ Escuchar")};
a.onerror=()=>{$("#msg").hidden=false};
$("#play").onclick=()=>{if(playing){a.pause();playing=false;$("#play").textContent="▶ Escuchar"}else{if(!a.src)go(0,true);else{playing=true;a.play();$("#play").textContent="⏸ Pausa"}}};
$("#prev").onclick=()=>go(i-1,true);$("#next").onclick=()=>go(i+1,true);
$("#spd").onclick=()=>{rate=rate>=1.5?0.85:rate+(rate<1?0.15:0.25);a.playbackRate=rate;$("#spd").textContent=rate.toFixed(2).replace(/0$/,"").replace(/\.$/,"")+"×"};
</script>
</body>
</html>
